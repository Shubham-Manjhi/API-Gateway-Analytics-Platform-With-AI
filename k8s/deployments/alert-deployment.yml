apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: api-analytics
  labels:
    app: alert-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
        - name: alert-service
          image: platform/alert-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:file:/config/common-config.yml"
            - name: OTEL_SERVICE_NAME
              value: "alert-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
